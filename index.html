<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한원석 — 작품 등록부</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<link rel="stylesheet" href="css/registry.css">
</head>
<body>

<header id="hdr"></header>

<section class="band">
  <div class="band__in">
    <!-- <div class="tot" id="tot"></div> -->
  </div>
</section>

<!-- <main class="wall" id="wall"></main> -->

<footer id="ftr"></footer>

<script type="module">
import { WORKS, STATUS } from './js/data/works.js';
import { mount, fmt } from './js/ui.js';

mount('wall');

/* 표제의 집계 — 이 작가에게 총 유닛 수는 이력서의 첫 줄에 해당한다 */
const total = WORKS.reduce((s, w) => s + w.n, 0);
const avail = WORKS.filter(w => w.status === 'available').length;
document.getElementById('tot').innerHTML =
  '<div>등록 작품<b class="num">' + String(WORKS.length).padStart(2,'0') + '</b></div>' +
  '<div>수거 유닛 총계<b class="num">' + fmt(total) + '</b></div>' +
  '<div>제작 기간<b class="num">2003 — 2024</b></div>' +
  '<div>문의 가능<b class="num">' + String(avail).padStart(2,'0') + '</b></div>';

/* 벽 — 칸 크기가 모두 같다. 위계 없이 나란히 쌓인다. */
document.getElementById('wall').innerHTML = WORKS.map(w =>
  '<a class="cell" href="work.html?id=' + w.id + '">' +
    '<img src="img/' + w.done + '.png" alt="' + w.t + '">' +
    '<div class="cell__t">' +
      '<b>' + w.t + '</b>' +
      '<span class="num">' + w.y + '</span>' +
    '</div>' +
    '<div class="cell__u"><i class="dot dot--' + w.status + '"></i>' + w.unit + '</div>' +
    '<div class="cell__n num">' + fmt(w.n) + '</div>' +
  '</a>').join('');
</script>
</body>
</html>
