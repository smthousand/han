<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WONSUKHAN</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:#111 url('img/bg5.png') repeat;
    background-size:calc(100vw / 3) auto;
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;
    font-size:15px;line-height:1.7;color:#e8e6e2;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}

  .logo,.burger{filter:drop-shadow(0 0 6px rgba(0,0,0,.7));}
  .logo{position:fixed;top:40px;left:40px;z-index:1;}
  .logo img{display:block;width:200px;height:auto;}
  .burger{position:fixed;top:44px;right:40px;z-index:1;
    width:32px;height:22px;background:none;border:0;cursor:pointer;
    display:flex;flex-direction:column;justify-content:space-between;}
  .burger i{display:block;height:2px;background:#fff;}

  /* 메뉴가 열리면 패턴 위에 검은 막 */
  .shade{position:fixed;inset:0;z-index:2;background:rgba(0,0,0,.72);
    opacity:0;pointer-events:none;transition:opacity .35s ease;}
  body.open .shade{opacity:1;pointer-events:auto;}

  /* 목차 패널 */
  .panel{position:fixed;top:0;right:0;bottom:0;z-index:3;
    width:80vw;background:#0a0a0a;overflow-y:auto;
    border-left:1px solid rgba(255,255,255,.08);
    padding:56px 64px 96px;
    transform:translateX(100%);transition:transform .4s cubic-bezier(.2,.7,.2,1);}
  body.open .panel{transform:none;}
  .close{position:absolute;top:40px;right:48px;background:none;border:0;
    color:#e8e6e2;font-size:30px;line-height:1;cursor:pointer;opacity:.8;}
  .close:hover{opacity:1;}

  #view{max-width:900px;word-break:keep-all;}
  .panel h1{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(232,230,226,.55);margin-bottom:34px;}
  .panel h2{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.3;}
  .panel h3{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(232,230,226,.55);margin:48px 0 10px;}
  .panel h3:first-of-type{margin-top:0;}
  .panel p{margin:0;}
  .dim{color:rgba(232,230,226,.5);}
  .sm{font-size:12px;}
  .gap{height:32px;}
  .num{font-variant-numeric:tabular-nums;}

  /* 목차 */
  .toc a{display:flex;justify-content:space-between;align-items:baseline;
    padding:16px 0;border-bottom:1px solid rgba(255,255,255,.12);
    font-size:22px;letter-spacing:-.01em;transition:padding .25s ease,color .25s ease;}
  .toc a:first-child{border-top:1px solid rgba(255,255,255,.12);}
  .toc a span{font-size:12px;color:rgba(232,230,226,.45);}
  .toc a:hover{padding-left:10px;color:#fff;}

  /* 표 */
  table{width:100%;border-collapse:collapse;}
  th{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
    color:rgba(232,230,226,.45);text-align:left;padding:0 16px 10px 0;
    border-bottom:1px solid rgba(232,230,226,.5);}
  td{padding:11px 16px 11px 0;border-bottom:1px solid rgba(255,255,255,.1);vertical-align:top;}
  td.y{width:72px;color:rgba(232,230,226,.55);white-space:nowrap;}
  td.p{width:34%;color:rgba(232,230,226,.55);}
  tr.ser td{padding-top:26px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:rgba(232,230,226,.45);border-bottom:1px solid rgba(255,255,255,.1);}
  tr.go{cursor:pointer;transition:background .2s ease;}
  tr.go:hover{background:rgba(255,255,255,.05);}
  tr.go td:first-child{padding-left:0;}
  tr.go:hover td:first-child{color:#fff;}
  tr.go td:first-child::after{content:' →';color:rgba(232,230,226,.35);}
  tr.nodet td:first-child{color:rgba(232,230,226,.5);}

  /* 작품 상세 */
  .spec th{width:120px;border:0;border-bottom:1px solid rgba(255,255,255,.1);
    padding:14px 16px 11px 0;vertical-align:top;}
  .spec tr:first-child th,.spec tr:first-child td{border-top:1px solid rgba(232,230,226,.5);}
  .txt{max-width:680px;font-size:15px;line-height:1.9;color:rgba(232,230,226,.88);}
  .txt p + p{margin-top:1.1em;}
  .quote{margin-top:40px;padding-left:22px;border-left:1px solid rgba(232,230,226,.3);}
  .quote .by{margin-top:14px;font-size:12px;color:rgba(232,230,226,.5);}
  .panel figure{margin:0 0 10px;}
  .panel figure img{display:block;width:100%;height:auto;}

  .pager{display:flex;justify-content:space-between;gap:20px;margin-top:56px;
    padding-top:18px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;}
  .pager a{color:rgba(232,230,226,.7);}
  .pager a:hover{color:#fff;}
  .back{display:inline-block;margin-top:40px;font-size:13px;color:rgba(232,230,226,.6);}
  .back:hover{color:#fff;}

  @media(max-width:700px){
    body{background-size:calc(100vw / 1.5) auto;}
    .logo{top:24px;left:20px;}
    .logo img{width:150px;}
    .burger{top:26px;right:20px;width:28px;height:19px;}
    .panel{width:100vw;padding:72px 20px 60px;}
    .close{top:20px;right:18px;}
    td.p,th.p{display:none;}
    .toc a{font-size:19px;}
  }
</style>
</head>
<body>

<a class="logo" href="#"><img src="img/logo.svg" alt="WONSUKHAN"></a>
<button class="burger" aria-label="목차"><i></i><i></i><i></i></button>

<div class="shade"></div>
<aside class="panel" aria-label="목차">
  <button class="close" aria-label="닫기">&times;</button>
  <div id="view"></div>
</aside>

<script src="data.js"></script>
<script src="works.js"></script>
<script src="texts.js"></script>
<script src="app.js"></script>
</body>
</html>
