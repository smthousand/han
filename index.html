<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WONSUKHAN</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Noto+Serif+KR:wght@500;600&display=swap">
<style>
  /* 검정 배경(스피커 사진을 아주 흐리게) · 화이트 · 포인트 #E1562A
     목록: 분류 → 4열 정사각 사진, 마우스를 올리면 제목 / 상세: 제목·정보 좌우 / 소개: 항목 이름 | 내용 */
  :root{
    --ink:#fff;             /* 본문·제목 — 화이트 */
    --text:#fff;            /* 필터 기본 */
    --dim:rgba(255,255,255,.62);   /* 보조 글자 */
    --line:rgba(255,255,255,.14); /* 가는 선 */
    --point:#E1562A;        /* 포인트 컬러 */
    --over:rgba(225,86,42,.92);  /* 격자 위에 올렸을 때 */
    --wrap:1100px;
    /* 제목용 바탕(명조) — 로고와 맞춘다. 영문은 Garamond, 한글·한자는 Noto Serif KR */
    --serif:'EB Garamond','Noto Serif KR','Noto Serif CJK KR','Nanum Myeongjo','AppleMyungjo',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:auto;}
  /* 배경 — 스피커 사진을 검은 막 아래 아주 흐리게 깐다. 격자만 눈에 들어오도록 */
  body{background:
      linear-gradient(rgba(0,0,0,.78),rgba(0,0,0,.78)) fixed,
      #000 url('img/bg5-2x2.png') repeat fixed;
    background-size:auto,calc(100vw / 12) auto;
    color:var(--ink);
    font-family:Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:16px;line-height:1.45;letter-spacing:-.2px;
    -webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}

  /* ── 머리 ── */
  header{height:88px;display:flex;align-items:center;justify-content:space-between;padding:0 50px;}
  .logo img{height:30px;width:auto;}
  nav{display:flex;gap:28px;}
  nav a{font-size:15px;font-weight:500;letter-spacing:-.2px;color:#fff;}
  nav a:hover,nav a.on{color:var(--point);}

  /* ── 공통 틀 ── */
  .wrap{width:var(--wrap);max-width:calc(100% - 40px);margin:0 auto;}

  /* ── 작품 목록 ── 제목 없이 분류만, 왼쪽 정렬 · 4열 정사각 · 마우스를 올리면 제목 */
  .filter{display:flex;flex-wrap:wrap;gap:6px 22px;margin:34px 0 30px;padding:0 50px;list-style:none;}
  .filter button{font-size:14px;font-weight:500;color:var(--dim);line-height:22px;}
  .filter button:hover{color:#fff;}
  .filter button.on{color:var(--point);}
  .filter button.on::before{content:'';display:inline-block;width:6px;height:6px;margin:0 7px 2px 0;
    background:var(--point);vertical-align:middle;}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:0 50px;}
  .item a{display:block;}
  .item .pic{position:relative;display:block;aspect-ratio:1/1;overflow:hidden;background:#1a1a1a;}
  .item img,.item .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .item .ph{background:#2a2a2a url('img/bg5-2x2.png') repeat;}
  /* 마우스를 올리면 주황 막 위에 제목 — 위에 연도·시리즈, 아래에 제목 */
  .hov{position:absolute;inset:0;padding:22px 24px;background:var(--over);opacity:0;
    display:flex;flex-direction:column;justify-content:space-between;color:#fff;}
  .item a:hover .hov,.item a:focus-visible .hov{opacity:1;}
  .hov span{font-size:13px;font-weight:500;color:rgba(0,0,0,.75);font-variant-numeric:tabular-nums;}
  .hov b{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.2;letter-spacing:0;
    word-break:keep-all;overflow-wrap:anywhere;}

  .more{display:block;margin:56px 50px 120px;font-size:14px;font-weight:600;
    border-bottom:1px solid #fff;padding-bottom:2px;}
  .more:hover{color:var(--point);border-color:var(--point);}
  .end{height:120px;}

  /* ── 작품 한 점 ── 제목과 정보를 좌우로 */
  .dhead{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding-top:60px;margin-bottom:44px;}
  .dhead h2{font-family:var(--serif);font-size:40px;font-weight:600;letter-spacing:0;line-height:1.2;}
  .dhead .sub{margin-top:10px;font-family:var(--serif);font-size:18px;font-weight:500;color:var(--dim);}
  .meta{font-size:14px;line-height:1.6;}
  .meta div{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:7px 0;border-top:1px solid var(--line);}
  .meta div:last-child{border-bottom:1px solid var(--line);}
  .meta dt{color:var(--dim);}
  .shots img,.shots .ph{width:100%;margin-bottom:24px;}
  .shots .ph{display:block;aspect-ratio:3/2;background:#2a2a2a url('img/bg5-2x2.png') repeat;background-size:260px auto;}
  .body{margin-top:50px;max-width:760px;}
  .body p{margin-bottom:1em;line-height:1.8;color:rgba(255,255,255,.85);}
  .body .lang{margin:40px 0 12px;font-size:12px;font-weight:600;color:var(--point);}
  .body .by{margin:56px 0 12px;font-size:13px;font-weight:600;}
  .pn{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;
    margin:90px 0 120px;padding-top:20px;border-top:1px solid #fff;font-size:14px;}
  .pn .nx{text-align:right;}
  .pn .all{font-weight:600;}
  .pn a:hover{color:var(--point);}

  /* ── 소개 ── 왼쪽에 항목 이름, 오른쪽에 내용 */
  .about{padding:60px 0 120px;font-size:14px;line-height:1.7;}
  .about section{display:grid;grid-template-columns:200px 1fr;gap:40px;padding:26px 0;border-top:1px solid #fff;}
  .about h5{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.3;}
  .about p{margin-bottom:10px;}
  .about a:hover{color:var(--point);}
  .about .yr{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
  .about .yr:first-child{padding-top:0;}
  .about .yr b{font-weight:600;font-variant-numeric:tabular-nums;}
  .about ul{list-style:none;}
  .about li{margin-bottom:4px;}
  .about li em{font-style:normal;color:var(--dim);}
  .about .solo{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;color:var(--point);}

  /* 맨 위로 */
  .top{position:fixed;right:24px;bottom:24px;width:40px;height:40px;
    background:#fff;color:#000;font-size:16px;display:none;align-items:center;justify-content:center;}
  .top:hover{background:var(--point);color:#fff;}
  .top.on{display:flex;}

  @media(max-width:1100px){ .grid{grid-template-columns:repeat(3,1fr);} }
  @media(max-width:800px){
    header{padding:0 20px;height:64px;}
    .logo img{height:21px;}
    nav{gap:16px;} nav a{font-size:14px;}
    .filter{padding:0 20px;margin-top:16px;gap:4px 16px;}
    .grid{grid-template-columns:repeat(2,1fr);gap:12px;padding:0 20px;}
    .hov{padding:14px;} .hov b{font-size:19px;} .hov span{font-size:11px;}
    .more{margin:40px 20px 90px;}
    .dhead{grid-template-columns:1fr;gap:24px;padding-top:30px;}
    .dhead h2{font-size:30px;}
    .about section{grid-template-columns:1fr;gap:14px;}
    .pn{grid-template-columns:1fr 1fr;} .pn .all{display:none;}
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="#"><img src="img/logo.svg" alt="Wonsuk Han"></a>
  <nav>
    <a href="#" data-r="works">Works</a>
    <a href="#about" data-r="about">About</a>
    <a href="https://www.instagram.com/han_wonsuk/" target="_blank" rel="noopener">Instagram</a>
  </nav>
</header>

<main id="view"></main>

<a class="top" href="#" aria-label="맨 위로">&uarr;</a>

<script src="data.js"></script>
<script src="works.js"></script>
<script src="images.js"></script>
<script src="texts_black_silhouette.js"></script>
<script src="texts_sound_tree.js"></script>
<script src="app.js"></script>
</body>
</html>
