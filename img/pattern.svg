<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- 스피커 유닛 한 칸. 사진이 아니라 도형으로 그린 패턴이라 납작하고 균일하다. -->
  <defs>
    <g id="unit">
      <!-- 사각 프레임 -->
      <rect x="4" y="4" width="192" height="192" fill="#151515"/>
      <rect x="4.5" y="4.5" width="191" height="191" fill="none" stroke="#3a3a3a" stroke-width="1"/>
      <!-- 나사 -->
      <g fill="#333333">
        <circle cx="18" cy="18" r="3.4"/><circle cx="182" cy="18" r="3.4"/>
        <circle cx="18" cy="182" r="3.4"/><circle cx="182" cy="182" r="3.4"/>
      </g>
      <!-- 바깥 테 -->
      <circle cx="100" cy="100" r="88" fill="none" stroke="#404040" stroke-width="2"/>
      <circle cx="100" cy="100" r="80" fill="#191919" stroke="#333333" stroke-width="1.5"/>
      <!-- 서라운드 -->
      <circle cx="100" cy="100" r="68" fill="none" stroke="#3d3d3d" stroke-width="7"/>
      <circle cx="100" cy="100" r="60" fill="#171717" stroke="#2c2c2c" stroke-width="1"/>
      <!-- 콘 -->
      <circle cx="100" cy="100" r="46" fill="none" stroke="#333333" stroke-width="1.5"/>
      <circle cx="100" cy="100" r="34" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
      <!-- 더스트 캡 -->
      <circle cx="100" cy="100" r="22" fill="#222222" stroke="#404040" stroke-width="1.5"/>
      <circle cx="100" cy="100" r="8" fill="none" stroke="#343434" stroke-width="1"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="#101010"/>
  <use href="#unit"/>
</svg>
