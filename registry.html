<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>등록부 — 한원석</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<link rel="stylesheet" href="css/registry.css">
</head>
<body>

<header id="hdr"></header>

<table class="reg">
  <thead>
    <tr>
      <th>등록번호</th>
      <th>작품</th>
      <th>유닛</th>
      <th class="hide">재료</th>
      <th class="hide">규모</th>
      <th>연도</th>
      <th>상태</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<footer id="ftr"></footer>

<script type="module">
import { WORKS, STATUS } from './js/data/works.js';
import { mount, fmt } from './js/ui.js';

mount('reg');

document.getElementById('rows').innerHTML =
  WORKS.map(w =>
    '<tr onclick="location.href=\'work.html?id=' + w.id + '\'" style="cursor:pointer">' +
      '<td class="id num">' + w.id + '</td>' +
      '<td class="t">' + w.t + '<em>' + w.te + '</em></td>' +
      '<td class="n num">' + fmt(w.n) + '<div class="sm" style="font-size:11px">' + w.unit + '</div></td>' +
      '<td class="sm hide">' + w.mat + '</td>' +
      '<td class="sm hide num">' + w.dim + '</td>' +
      '<td class="sm num">' + w.y + '</td>' +
      '<td class="st"><i class="dot dot--' + w.status + '"></i>' + STATUS[w.status].t + '</td>' +
    '</tr>').join('');
</script>
</body>
</html>
