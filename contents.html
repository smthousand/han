<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>목차 — 한원석</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<link rel="stylesheet" href="css/catalogue.css">
</head>
<body>

<div class="rh" id="rh"></div>

<main class="page">
  <header class="sect">
    <div class="sect__no">목차</div>
    <h1 class="sect__t">한원석<em>Contents</em></h1>
  </header>

  <nav class="ls ls--toc" id="toc"></nav>

  <div class="colophon">
    <div>wonsukhan@hotmail.com<br>H lab. Studio<br>Seoul, Korea / London, UK</div>
    <div><a href="https://www.instagram.com/han_wonsuk/">Instagram</a><br>
      <a href="index.html">← 표지</a></div>
  </div>
</main>

<script type="module">
import { SECTIONS, mountRH } from './js/rh.js';
mountRH(null);

/* 목차 — 장 순서와 이름은 rh.js 한 곳에서 관리한다 */
document.getElementById('toc').innerHTML = SECTIONS.map(function (s, i) {
  return '<a href="' + s.href + '">' +
    '<span class="ls__n num">' + s.no + '</span>' +
    '<span class="ls__t">' + s.t + '<em>' + s.e + '</em></span>' +
    '<span class="ls__p num">' + String((i + 1) * 4).padStart(3, '0') + '</span>' +
  '</a>';
}).join('');
</script>
</body>
</html>
