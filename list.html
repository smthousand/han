<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도판 목록 — 한원석</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<link rel="stylesheet" href="css/catalogue.css">
</head>
<body>

<div class="rh" id="rh"></div>

<main class="page">
  <header class="sect">
    <div class="sect__no">Ⅱ</div>
    <h1 class="sect__t">도판 목록<em>List of Plates</em></h1>
    <p class="sect__note">도판 번호순. 이미지 없이 기재만 한다.</p>
  </header>

  <div class="ls ls--plates" id="list"></div>

  <nav class="leaf" id="leaf"></nav>

  <div class="colophon">
    <div>wonsukhan@hotmail.com<br>H lab. Studio</div>
    <div><a href="contents.html">← 목차</a></div>
  </div>
</main>

<script type="module">
import { WORKS } from './js/data/works.js';
import { mountRH, mountLeaf } from './js/rh.js';

mountRH('list');
mountLeaf('list');

document.getElementById('list').innerHTML = WORKS.map(function (w) {
  return '<a href="work.html?id=' + w.n + '">' +
    '<span class="ls__n num">pl. ' + w.n + '</span>' +
    '<span class="ls__t">' + w.t + '<em>' + w.v + '</em></span>' +
    '<span class="ls__m">' + w.m + '</span>' +
    '<span class="ls__s ls__m num">' + w.q + '</span>' +
    '<span class="ls__p num">' + w.y + '</span>' +
  '</a>';
}).join('');
</script>
</body>
</html>
